<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="description" content="NERO 테스트 공지사항 페이지" />
        <title>NERO Test | Announcement</title>
        <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
        <link rel="stylesheet" href="/css/styles.css" />
        <link rel="stylesheet" href="/css/test.css" />
        <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    </head>
    <body class="test-page">
        <nav class="test-nav test-shell" aria-label="테스트 페이지 메뉴">
            <a class="test-logo" href="/test">
                <img src="/assets/img/landing/nero_logo.svg" alt="NERO" />
            </a>
            <div class="test-nav-links">
                <a href="/test">Home</a>
                <a class="is-active" href="/test/announcement">Announcement</a>
                <a href="/test/services">Services</a>
                <a href="/landing">Landing</a>
            </div>
            <a class="test-button" href="mailto:official@nero.ai.kr">Contact</a>
        </nav>

        <main>
            <section class="test-hero">
                <div class="test-shell">
                    <div class="test-eyebrow">Announcement</div>
                    <h1>공지를 빠르게 찾고, 중요한 업데이트를 놓치지 않게</h1>
                    <p>법정공고, 일반공지, 보도자료를 기존 데이터 구조 그대로 불러오되 검색과 필터 중심의 UI로 재구성했습니다.</p>
                </div>
            </section>

            <section class="test-section">
                <div class="test-shell">
                    <div class="test-filter-bar test-reveal">
                        <div class="test-tabs" role="tablist" aria-label="공고 카테고리 필터">
                            <button class="filter-tab active" data-category="전체" role="tab" aria-selected="true">전체</button>
                            <button class="filter-tab" data-category="법정공고" role="tab" aria-selected="false">법정공고</button>
                            <button class="filter-tab" data-category="일반공지" role="tab" aria-selected="false">일반공지</button>
                            <button class="filter-tab" data-category="보도자료" role="tab" aria-selected="false">보도자료</button>
                        </div>
                        <div class="search-container">
                            <input type="text" class="search-input" placeholder="공고 제목으로 검색" aria-label="공고 검색" />
                        </div>
                    </div>

                    <div id="announcements-list" class="announcements-list" role="main" aria-label="공고 목록">
                        <div class="loading-spinner" id="loading-spinner">
                            <div class="spinner"></div>
                        </div>
                    </div>
                    <ul class="pagination" id="pagination"></ul>

                    <div class="empty-state d-none" id="empty-state">
                        <h3>검색 결과가 없습니다</h3>
                        <p>다른 키워드로 다시 검색해보세요.</p>
                    </div>

                    <div class="empty-state d-none" id="portfolio-empty-state">
                        <h3>포트폴리오 항목이 없습니다</h3>
                        <p>아직 등록된 포트폴리오 항목이 없습니다.</p>
                    </div>
                </div>
            </section>
        </main>

        <div class="modal fade test-modal" id="announcementModal" tabindex="-1" aria-labelledby="announcementModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-lg modal-dialog-scrollable modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="announcementModalLabel">공고 상세</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
                    </div>
                    <div class="modal-body" id="announcementModalBody"></div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="/scripts/announcement.js"></script>
        <script src="/scripts/services.js"></script>
    </body>
</html>
