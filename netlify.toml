[build]
  base = "."
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

# Explicit generated rewrites preserve existing extensionless canonical URLs.
# Netlify normalizes trailing slashes; slash-only redirect rules would loop.
[build.processing.html]
  pretty_urls = false

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  command = "npm run serve"
  targetPort = 4173
  port = 8888
  publish = "dist"
